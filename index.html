<style>
:root{--ink:#1d2140;--muted:#5b6080;--line:#e3e5f2;--accent:#5c61e8;--bg:#ffffff;--soft:#f5f6fd}
@media (prefers-color-scheme:dark){:root{--ink:#eceefb;--muted:#a9adcc;--line:#2c3157;--accent:#9a9dff;--bg:#12152e;--soft:#1a1e3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 20px 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;font-size:14px}
.brand{font-weight:700;color:var(--ink);text-decoration:none}
a{color:var(--accent)}
h1{font-size:30px;line-height:1.2;margin:0 0 6px}
.meta{color:var(--muted);font-size:14px;margin:0 0 24px}
.summary{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 28px}
h2{font-size:19px;margin:32px 0 8px}
ul{padding-left:22px}
li{margin:4px 0}
table{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
.tablewrap{overflow-x:auto}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
</style>
</head>
<body>
